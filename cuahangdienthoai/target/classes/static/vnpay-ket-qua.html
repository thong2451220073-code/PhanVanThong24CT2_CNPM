<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết quả thanh toán VNPAY</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .vnpay-box{max-width:480px;margin:80px auto;padding:32px;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.1);text-align:center}
  .vnpay-box .icon{font-size:56px;margin-bottom:12px}
  .vnpay-box.thanh-cong .icon{color:#16a34a}
  .vnpay-box.that-bai .icon{color:#dc2626}
  .vnpay-box a.btn{display:inline-block;margin-top:20px;padding:10px 24px;border-radius:8px;text-decoration:none;background:#111;color:#fff}
</style>
</head>
<body>
  <div id="ketQua" class="vnpay-box">
    <div class="icon">⏳</div>
    <h2>Đang xác nhận thanh toán...</h2>
  </div>

  <script>
    (async function () {
      const box = document.getElementById('ketQua');
      const queryString = window.location.search;
      try {
        const res = await fetch('/api/thanh-toan/vnpay/xac-nhan' + queryString);
        const data = await res.json();

        if (data.thanhCong) {
          box.className = 'vnpay-box thanh-cong';
          box.innerHTML = `
            <div class="icon">✅</div>
            <h2>Thanh toán thành công!</h2>
            <p>Đơn hàng <b>${data.maDonHang || ''}</b> đã được thanh toán qua VNPAY.</p>
            <a class="btn" href="/#orders">Xem đơn hàng của tôi</a>`;
        } else {
          box.className = 'vnpay-box that-bai';
          box.innerHTML = `
            <div class="icon">❌</div>
            <h2>Thanh toán không thành công</h2>
            <p>Đơn hàng <b>${data.maDonHang || ''}</b> chưa được thanh toán (mã lỗi VNPAY: ${data.maPhanHoiVnpay || '-'}).</p>
            <a class="btn" href="/#orders">Quay lại đơn hàng</a>`;
        }
      } catch (e) {
        box.className = 'vnpay-box that-bai';
        box.innerHTML = `
          <div class="icon">⚠️</div>
          <h2>Có lỗi xảy ra</h2>
          <p>Không thể xác nhận kết quả thanh toán. Vui lòng kiểm tra lại đơn hàng của bạn.</p>
          <a class="btn" href="/#orders">Quay lại đơn hàng</a>`;
      }
    })();
  </script>
</body>
</html>
